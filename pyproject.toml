[project]
name = "regulatory-change-impact-brief"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "jsonschema==4.26.0", "icalendar==7.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts", "tests/runtime"]
pythonpath = ["regulatory-change-impact-brief/scripts", "tests"]
addopts = "-p no:cacheprovider"
